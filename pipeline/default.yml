- id: workspace
  archetype: setup
  contract: []
  procedure: craft:workspace
  produces:
    - workspace

- id: requirements
  archetype: specification
  enabled: false
  contract:
    - producer
  procedure: craft:requirements
  turn_budget: 100
  role: craft:requirements-writer
  model: opus
  consumes:
    - workspace
  produces:
    - requirements

- id: design
  archetype: specification
  contract:
    - producer
  procedure: craft:design
  turn_budget: 100
  role: craft:designer
  model: opus
  consumes:
    - workspace
    - requirements
  self_supply:
    - requirements
  produces:
    - design

- id: decisions
  archetype: specification
  contract: []
  procedure: craft:decisions
  turn_budget: 100
  consumes:
    - design
  self_supply:
    - design
  produces:
    - decisions

- id: planning
  archetype: specification
  contract:
    - producer
  procedure: craft:planning
  turn_budget: 100
  role: craft:planner
  model: opus
  consumes:
    - design
    - decisions
  self_supply:
    - design
    - decisions
  produces:
    - plan
  gate: plan-lint

- id: implementation
  archetype: construction
  contract:
    - construction
  procedure: craft:implementation
  turn_budget: 150
  role: craft:part-implementer
  model: sonnet
  consumes:
    - workspace
    - plan
  produces:
    - change
  gate: <gates.phase>

- id: review
  archetype: harness
  contract:
    - harness-read
  procedure: craft:review
  turn_budget: 60
  role: craft:reviewer
  model: opus
  consumes:
    - change
  produces:
    - review-report
  gate: <gates.phase>
  harness:
    dimensions: [code, security, tests, perf]
    passes: 1
    max_cycles: 3
    convergence: low-only

- id: refactoring
  archetype: refinement
  contract:
    - refinement
  procedure: craft:refactoring
  turn_budget: 130
  role: craft:refactor-executor
  model: sonnet
  consumes:
    - change
  produces:
    - change
  gate: <gates.phase>

- id: validation
  archetype: harness
  contract:
    - harness-exec
  procedure: craft:validation
  turn_budget: 150
  role: craft:harness-triager
  model: sonnet
  consumes:
    - change
  produces:
    - validation-report
  gate: <validation gate>
  harness:
    scope: per-hunk
    techniques: []

- id: architecture
  archetype: harness
  enabled: false
  contract:
    - harness-exec
  procedure: craft:architecture
  turn_budget: 150
  role: craft:harness-triager
  model: opus
  consumes:
    - change
  produces:
    - architecture-report
  gate: <arch gate>
  harness:
    techniques: []

- id: documentation
  archetype: delivery
  contract:
    - delivery
  procedure: craft:documentation
  turn_budget: 150
  role: craft:docs-writer
  model: sonnet
  consumes:
    - design
    - change
  produces:
    - docs

- id: propose
  archetype: delivery
  contract:
    - delivery
  procedure: craft:propose
  turn_budget: 150
  consumes:
    - change
  produces:
    - pr
  gate: pr.pre-pr-gate

- id: integrate
  archetype: delivery
  contract:
    - delivery
  procedure: craft:integrate
  turn_budget: 150
  consumes:
    - pr
