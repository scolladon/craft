# Merge these keys into $CODEX_HOME/config.toml (default ~/.codex/config.toml) — user
# level, not repo level.
#
# Sandbox mode is explicit and always the writable-but-scoped mode — the unrestricted
# full-access mode is never selected here. Per-sandbox-mode blocking was never measured
# against this binding, so this template documents a posture, not a containment
# guarantee. The PreToolUse guard hook (hooks.json) is the layer that actually denies.
#
# Provider-neutral: no model id below is pinned outside the three ids this binding's
# own tier map (src/model-tier-map.js) commits to.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

# Interactive tty sessions are off. codex fires no PreToolUse hook for `write_stdin`, and
# only a tty session keeps stdin open for it to type into, so with tty sessions off the
# text it would type reaches no shell. Removing this line reopens that channel. Cost: the
# model gets no interactive shell, REPL or prompt-answering session. If your config.toml
# already has a [features] table, add the key there: a second [features] header is
# invalid TOML.
[features]
unified_exec_tty = false

# The guard registration. `codex plugin add` drops a plugin manifest's `hooks` field, so
# this block — not the marketplace install — is what wires the PreToolUse guard. Omit it
# and codex registers no hook at all, a state indistinguishable at runtime from the
# untrusted-hook silent no-op: installed, silent, enforcing nothing.
#
# The command is the interpreter, then the guard path as one double-quoted operand,
# because that is the only form `bin/trust-hook.js` will trust. The quotes keep a
# checkout path containing a space one word under every shell. Inside the quotes only
# path characters, plain spaces and the exact `${CRAFT_ROOT:-${CLAUDE_PLUGIN_ROOT}}`
# placeholder are allowed, the path starts at `/` or at that placeholder followed by
# `/`, and the interpreter is `node` or an absolute path to it. Adding a flag, a
# relative path, chaining a second command, wrapping it in a shell, or any other `$`
# expansion makes the trust helper refuse the registration. The value is a TOML literal
# string (single quotes), so the double quotes need no escaping.
#
# `${CRAFT_ROOT:-${CLAUDE_PLUGIN_ROOT}}` is expanded by the shell codex runs hook commands
# through. A hand-wired entry gets no `CLAUDE_PLUGIN_ROOT`, so either export
# `CRAFT_ROOT=<repo checkout>` or substitute that absolute path here, inside the double
# quotes.
[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "${CRAFT_ROOT:-${CLAUDE_PLUGIN_ROOT}}/adapters/codex/hooks/craft-guard.js"'

