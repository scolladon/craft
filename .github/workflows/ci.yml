name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        run: cd engine && npm ci

      - name: Install bats, shellcheck, jq
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Substrate gate
        run: bash scripts/ci.sh

  readme-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      # The guard's only runtime dependency is js-yaml — skip the dev toolchain.
      - name: Install engine dependencies
        run: cd engine && npm ci --omit=dev
      - name: README drift guard
        run: bash scripts/readme-drift.sh

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline mode: verifies every relative link and #fragment across the repo's
      # markdown deterministically (no network flakes); external URLs are not checked.
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --exclude-path engine/node_modules './**/*.md'
          fail: true
