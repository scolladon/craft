# Consumer expects 'widget' artifact but no enabled producer provides it
# and 'widget' is not in self_supply — this must fail validation
- id: workspace
  archetype: setup
  contract: []
  procedure: craft:workspace
  produces:
    - workspace

- id: implementation
  archetype: construction
  contract:
    - construction
  procedure: craft:implementation
  consumes:
    - workspace
    - widget
  produces:
    - change
