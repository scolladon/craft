# self_supply contains 'extra' which is NOT in consumes — must fail validation
- id: workspace
  archetype: setup
  contract: []
  procedure: craft:workspace
  produces:
    - workspace

- id: design
  archetype: specification
  contract:
    - producer
  procedure: craft:design
  consumes:
    - workspace
  self_supply:
    - extra
  produces:
    - design
